<!DOCTYPE html>
<html lang="en">
<head>
    <title>Modelohhhhh | Firplak</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script src="https://code.jquery.com/jquery-2.1.3.min.js"></script>
    <link rel="stylesheet" href="premium.css">
</head>
<body>

<div id="mainarea">
    <div class="loader-container" id="compilingmessage">
        <h1 class="loader-title">Modelohhhhh</h1>
        <div class="progress-bar-container">
            <div id="loadingProgress" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.3s;"></div>
        </div>
        <div id="loadTasks">Iniciando motor...</div>
    </div>
    
    <canvas tabindex=0 id="canvas" class="emscripten" oncontextmenu="event.preventDefault()" style="display:none;"></canvas>
</div>

<div class="controls" id="buttonrow">
    <button class="btn-premium" onclick="try { Module['pauseMainLoop'](); } catch(e) {}">Pausar</button>
    <button class="btn-premium" onclick="try { Module['resumeMainLoop'](); } catch(e) {}">Reanudar</button>
    <button class="btn-premium" onclick="var w = document.getElementById('logwindow'); w.style.display = w.style.display ? '' : 'none';">Ver Log</button>
    <button class="btn-premium" id="fullscreen_request">Pantalla Completa</button>
    <button class="btn-premium" id="clear_indexeddb" onclick="try { deleteIndexedDBStorage(); } catch(e) {}">Limpiar Caché</button>
</div>

<div id="logwindow" style="display:none"></div>

<script src="MyProject.UE4.js"></script>
<script>
    // Mutation observer to update our premium progress bar
    const observer = new MutationObserver(function(mutations) {
        const text = document.getElementById('loadTasks').innerText;
        // Simple heuristic to extract percentage if it exists in the text
        const match = text.match(/(\d+)%/);
        if (match) {
            document.getElementById('loadingProgress').style.width = match[1] + '%';
        }
    });
    
    observer.observe(document.getElementById('loadTasks'), { childList: true, subtree: true, characterData: true });
</script>
</body>
</html>
